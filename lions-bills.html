<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lions vs. Bills — Showdown Salaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --lions-blue: #0076B6;
    --lions-blue-dark: #00527d;
    --bills-red: #C60C30;
    --bills-red-dark: #8f0821;
    --navy: #0F1A2E;
    --accent: #22c55e;
    --ink: #12161f;
    --paper: #ffffff;
    --paper-alt: #f6f7f9;
    --line: #e4e6ec;
    --muted: #6b7280;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eef0f4;
      --paper: #12151c;
      --paper-alt: #171b24;
      --line: #262b36;
      --muted: #9aa1af;
    }
  }
  :root[data-theme="dark"] {
    --ink: #eef0f4;
    --paper: #12151c;
    --paper-alt: #171b24;
    --line: #262b36;
    --muted: #9aa1af;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper-alt);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-feature-settings: 'tnum' 1;
  }

  /* ---------- Masthead ---------- */
  .masthead { position: relative; display: flex; min-height: 148px; overflow: hidden; }
  .half { flex: 1; display: flex; align-items: center; padding: 0 clamp(20px, 5vw, 56px); position: relative; min-width: 0; }
  .half.lions {
    background: linear-gradient(120deg, var(--lions-blue-dark) 0%, var(--lions-blue) 100%);
    justify-content: flex-end; text-align: right;
    clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
  }
  .half.bills {
    background: linear-gradient(120deg, var(--bills-red) 0%, var(--bills-red-dark) 100%);
    justify-content: flex-start; text-align: left;
    clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
    margin-left: -8%;
  }
  .team-block { color: #fff; min-width: 0; }
  .team-name {
    font-family: 'Anton', sans-serif;
    font-size: clamp(28px, 4.2vw, 52px);
    line-height: 0.92;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .team-sub { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; opacity: 0.85; margin-top: 4px; }
  .vs-badge {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5;
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 20px; letter-spacing: 1px;
    box-shadow: 0 0 0 5px var(--paper-alt), 0 6px 18px rgba(0,0,0,0.35);
  }

  .meta-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 16px clamp(16px, 4vw, 40px);
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .updated { font-size: 12.5px; color: var(--muted); }
  .search-input {
    flex: 1; max-width: 340px; min-width: 180px;
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; background: var(--paper-alt); color: var(--ink); font-family: inherit;
  }
  .search-input:focus { outline: 2px solid var(--lions-blue); outline-offset: 1px; }

  /* ---------- Table (reverted to original look) ---------- */
  .wrap { padding: clamp(12px, 3vw, 40px); }
  .table-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 1080px; font-size: 13px; }

  thead th {
    text-align: center;
    padding: 10px 10px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #fff;
    background: var(--navy);
    border-bottom: 3px solid var(--accent);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:first-child { text-align: left; }
  thead th:hover { background: #182643; }
  .arrow { color: var(--accent); font-size: 9px; }

  tbody tr { border-bottom: 1px solid var(--line); }
  tbody tr:nth-child(even) { background: var(--paper-alt); }
  tbody tr:hover { background: #eef2f8; }
  tbody td { padding: 10px 10px; text-align: center; white-space: nowrap; }
  tbody td:first-child { text-align: left; font-weight: 600; }

  .pos-pill {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    padding: 3px 9px; border-radius: 5px; color: #fff;
  }
  .team-pill {
    display: inline-block; font-size: 11px; font-weight: 800;
    padding: 3px 9px; border-radius: 5px; color: #fff;
    letter-spacing: 0.3px;
  }
  .team-DET { background: var(--lions-blue); }
  .team-BUF { background: var(--bills-red); }
  .pos-QB  { background: #3b82f6; }
  .pos-RB  { background: #22c55e; }
  .pos-WR  { background: #d97706; }
  .pos-TE  { background: #8b5cf6; }
  .pos-K   { background: #6b7280; }
  .pos-DST { background: #dc2626; }

  footer { text-align: center; padding: 18px; font-size: 11.5px; color: var(--muted); }

  @media (max-width: 640px) {
    .half.bills { margin-left: -14%; }
    .vs-badge { width: 48px; height: 48px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="half lions">
    <div class="team-block">
      <div class="team-sub">AWAY</div>
      <div class="team-name">Detroit Lions</div>
    </div>
  </div>
  <div class="vs-badge">VS</div>
  <div class="half bills">
    <div class="team-block">
      <div class="team-sub">HOME</div>
      <div class="team-name">Buffalo Bills</div>
    </div>
  </div>
</div>

<div class="meta-bar">
  <input class="search-input" id="search" type="text" placeholder="Search name or team…">
  <div class="updated" id="updated"></div>
</div>

<div class="wrap">
  <div class="table-card">
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th data-key="team">Team</th>
            <th>Pos</th>
            <th class="num" data-key="dk">DK Flex Sal<span class="arrow"></span></th>
            <th class="num" data-key="dkCpt">DK Cpt Sal<span class="arrow"></span></th>
            <th class="num" data-key="dkProj">DK Proj<span class="arrow"></span></th>
            <th class="num" data-key="dkFppg">DK FPPG<span class="arrow"></span></th>
            <th class="num" data-key="dkValue">DK/$<span class="arrow"></span></th>
            <th class="num" data-key="fd">FD Sal<span class="arrow"></span></th>
            <th class="num" data-key="fdMvp">FD MVP Sal<span class="arrow"></span></th>
            <th class="num" data-key="fdProj">FD Proj<span class="arrow"></span></th>
            <th class="num" data-key="fdFppg">FD FPPG<span class="arrow"></span></th>
            <th class="num" data-key="fdValue">FD/$<span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<footer>Detroit Lions @ Buffalo Bills · Thursday Night Football · DFS Salaries &amp; Projections</footer>

<script>
let players = [];
let heatRange = {};
let sortKey = 'dkProj';
let sortDir = -1;
const heatCols = ['dkProj', 'fdProj', 'dkFppg', 'fdFppg', 'dkValue', 'fdValue'];

function heatColor(key, value) {
  if (value == null) return '';
  const { min, max } = heatRange[key] || {};
  if (max === min || max == null) return '';
  const t = Math.max(0, Math.min(1, (value - min) / (max - min)));
  const lo = [230, 126, 90], mid = [255, 255, 255], hi = [0, 118, 182];
  const c = t < 0.5
    ? lo.map((v, i) => Math.round(v + (mid[i] - v) * (t / 0.5)))
    : mid.map((v, i) => Math.round(v + (hi[i] - v) * ((t - 0.5) / 0.5)));
  return `background: rgb(${c[0]},${c[1]},${c[2]})`;
}

function money(v) { return v == null ? '—' : '$' + v.toLocaleString(); }
function num(v, d=2) { return v == null ? '—' : Number(v).toFixed(d); }

function render(filterText) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const q = (filterText || '').trim().toLowerCase();

  const rows = players
    .filter(p => !q || p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q))
    .sort((a, b) => {
      if (sortKey === 'team') return sortDir * a.team.localeCompare(b.team);
      return sortDir * ((a[sortKey] ?? -Infinity) - (b[sortKey] ?? -Infinity));
    });

  rows.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.name}</td>
      <td><span class="team-pill team-${p.team}">${p.team}</span></td>
      <td><span class="pos-pill pos-${p.pos}">${p.pos}</span></td>
      <td class="num">${money(p.dk)}</td>
      <td class="num">${money(p.dkCpt)}</td>
      <td class="num" style="${heatColor('dkProj', p.dkProj)}">${num(p.dkProj)}</td>
      <td class="num" style="${heatColor('dkFppg', p.dkFppg)}">${num(p.dkFppg, 1)}</td>
      <td class="num" style="${heatColor('dkValue', p.dkValue)}">${num(p.dkValue)}</td>
      <td class="num">${money(p.fd)}</td>
      <td class="num">${money(p.fdMvp)}</td>
      <td class="num" style="${heatColor('fdProj', p.fdProj)}">${num(p.fdProj)}</td>
      <td class="num" style="${heatColor('fdFppg', p.fdFppg)}">${num(p.fdFppg, 1)}</td>
      <td class="num" style="${heatColor('fdValue', p.fdValue)}">${num(p.fdValue)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function updateArrows(activeTh) {
  document.querySelectorAll('th[data-key] .arrow').forEach(a => a.textContent = '');
  const arrow = activeTh.querySelector('.arrow');
  if (arrow) arrow.textContent = sortDir === -1 ? ' ▼' : ' ▲';
}

function wireControls() {
  document.getElementById('search').addEventListener('input', e => render(e.target.value));
  document.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (key === sortKey) { sortDir *= -1; } else { sortKey = key; sortDir = -1; }
      updateArrows(th);
      render(document.getElementById('search').value);
    });
  });
  updateArrows(document.querySelector('th[data-key="dkProj"]'));
}

async function init() {
  const updatedEl = document.getElementById('updated');
  try {
    const res = await fetch('lions-bills.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    players = data.players || [];
    players.forEach(p => {
      p.dkCpt = Math.round(p.dk * 1.5);
      p.fdMvp = Math.round(p.fd * 1.5);
    });
    heatCols.forEach(k => {
      const vals = players.map(p => p[k]).filter(v => v != null);
      heatRange[k] = vals.length ? { min: Math.min(...vals), max: Math.max(...vals) } : { min: 0, max: 0 };
    });
    if (data.lastUpdated) {
      const d = new Date(data.lastUpdated);
      updatedEl.textContent = 'Last updated: ' + d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    wireControls();
    render('');
  } catch (err) {
    updatedEl.textContent = 'Could not load lions-bills.json';
    document.getElementById('tbody').innerHTML = `<tr><td colspan="13" style="text-align:center;padding:24px;color:var(--muted)">Couldn't load salary data (${err.message}). Make sure lions-bills.json is in the same folder as this page.</td></tr>`;
  }
}

init();
</script>
</script>
</body>
</html>
